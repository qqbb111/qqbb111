<svg xmlns="http://www.w3.org/2000/svg" width="350" height="34" viewBox="0 0 350 34" role="img" aria-label="C++, Linux, CMake, Git, Python">
  <defs>
    <linearGradient id="blue-glass" x1="0" y1="0" x2="0" y2="1">
      <stop class="blue-top" offset="0" />
      <stop class="blue-bottom" offset="1" />
    </linearGradient>
    <linearGradient id="gray-glass" x1="0" y1="0" x2="0" y2="1">
      <stop class="gray-top" offset="0" />
      <stop class="gray-bottom" offset="1" />
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".58" />
      <stop offset=".48" stop-color="#ffffff" stop-opacity=".12" />
      <stop offset=".49" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <filter id="soft-shadow" x="-10%" y="-15%" width="120%" height="140%">
      <feDropShadow dx="0" dy="1.2" stdDeviation="1.1" flood-color="#1f2328" flood-opacity=".18" />
    </filter>
  </defs>
  <style>
    .pill { stroke-width: 1; filter: url(#soft-shadow); }
    .blue { fill: url(#blue-glass); stroke: #0969da; stroke-opacity: .42; }
    .gray { fill: url(#gray-glass); stroke: #57606a; stroke-opacity: .38; }
    .blue-top { stop-color: #dbeafe; stop-opacity: .95; }
    .blue-bottom { stop-color: #0969da; stop-opacity: .13; }
    .gray-top { stop-color: #ffffff; stop-opacity: .88; }
    .gray-bottom { stop-color: #57606a; stop-opacity: .13; }
    .blue-text { fill: #0755b5; }
    .gray-text { fill: #424a53; }
    .shine { fill: url(#sheen); pointer-events: none; }
    .edge-light { stroke: #ffffff; stroke-opacity: .62; stroke-width: 1; fill: none; }
    .edge-shadow { stroke: #1f2328; stroke-opacity: .14; stroke-width: 1; fill: none; }
    text { font: 600 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    @media (prefers-color-scheme: dark) {
      .blue { stroke: #79c0ff; stroke-opacity: .62; }
      .gray { stroke: #8b949e; stroke-opacity: .58; }
      .blue-top { stop-color: #79c0ff; stop-opacity: .30; }
      .blue-bottom { stop-color: #1f6feb; stop-opacity: .18; }
      .gray-top { stop-color: #c9d1d9; stop-opacity: .26; }
      .gray-bottom { stop-color: #8b949e; stop-opacity: .18; }
      .blue-text { fill: #a5d6ff; }
      .gray-text { fill: #c9d1d9; }
      .edge-light { stroke: #ffffff; stroke-opacity: .34; }
      .edge-shadow { stroke: #010409; stroke-opacity: .30; }
    }
  </style>
  <g transform="translate(0 1)"><rect class="pill blue" width="55" height="30" rx="8"/><rect class="shine" x="1" y="2" width="53" height="14" rx="7"/><path class="edge-light" d="M8 2.5h39"/><path class="edge-shadow" d="M8 29.5h39"/><text class="blue-text" x="27.5" y="19" text-anchor="middle">C++</text></g>
  <g transform="translate(63 1)"><rect class="pill blue" width="61" height="30" rx="8"/><rect class="shine" x="1" y="2" width="59" height="14" rx="7"/><path class="edge-light" d="M8 2.5h45"/><path class="edge-shadow" d="M8 29.5h45"/><text class="blue-text" x="30.5" y="19" text-anchor="middle">Linux</text></g>
  <g transform="translate(132 1)"><rect class="pill gray" width="70" height="30" rx="8"/><rect class="shine" x="1" y="2" width="68" height="14" rx="7"/><path class="edge-light" d="M8 2.5h54"/><path class="edge-shadow" d="M8 29.5h54"/><text class="gray-text" x="35" y="19" text-anchor="middle">CMake</text></g>
  <g transform="translate(210 1)"><rect class="pill gray" width="46" height="30" rx="8"/><rect class="shine" x="1" y="2" width="44" height="14" rx="7"/><path class="edge-light" d="M8 2.5h30"/><path class="edge-shadow" d="M8 29.5h30"/><text class="gray-text" x="23" y="19" text-anchor="middle">Git</text></g>
  <g transform="translate(264 1)"><rect class="pill gray" width="70" height="30" rx="8"/><rect class="shine" x="1" y="2" width="68" height="14" rx="7"/><path class="edge-light" d="M8 2.5h54"/><path class="edge-shadow" d="M8 29.5h54"/><text class="gray-text" x="35" y="19" text-anchor="middle">Python</text></g>
</svg>
